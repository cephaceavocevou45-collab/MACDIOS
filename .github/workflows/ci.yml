name: Qualité et intégration continue

on:
  push:
  pull_request:

jobs:
  backend:
    name: Tests, couverture et Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: cle-ci-sans-valeur-de-production
      DEBUG: "True"
      DB_ENGINE: sqlite
      KKIAPAY_SANDBOX: "True"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Installer les dépendances backend
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier le lint Python
        run: ruff check .
      - name: Exécuter les tests avec couverture minimale de 80 %
        run: pytest
      - name: Publier le rapport de couverture HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: backend/htmlcov/
          if-no-files-found: ignore

  frontend:
    name: ESLint et build Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances frontend
        run: npm ci
      - name: Vérifier le lint JavaScript
        run: npm run lint
      - name: Compiler le frontend
        run: npm run build
